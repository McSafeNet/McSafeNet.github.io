short_bio: >-
  <p>
    你好，我是 <b>Bohua Yang（Edward）</b>，GitHub 上的 <a href="https://github.com/McSafeNet" target="_blank">@McSafeNet</a>。
    我专注于 Windows 平台的调试与逆向分析工具开发。
  </p>
  <p>
    我开发了 <a href="https://github.com/McSafeNet/McDbg" target="_blank"><b>McDbg</b></a>——一款仿照 OllyDbg 设计的
    Windows 用户态动态调试器，同时支持 x64 与 x86 程序，快捷键与 OllyDbg 基本一致，老用户可以直接上手。
    配套的 <a href="https://github.com/McSafeNet/McDbg-Plugins" target="_blank">McDbg-Plugins</a> 提供了插件 SDK
    以及 ScyllaHide、SwissArmyKnife、HotSpots 等开源插件。
  </p>
  <p>
    官方论坛：<a href="https://www.mcsafenet.com" target="_blank">www.mcsafenet.com</a>，
    个人博客：<a href="https://www.mcsafenet.com/plugin.php?id=hl_blog:home" target="_blank">McSafeNet Blog</a>，欢迎交流反馈。
  </p>

